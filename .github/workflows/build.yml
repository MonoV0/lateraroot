name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare attributed Flaticon UI icons
        shell: pwsh
        run: ./scripts/Prepare-Icons.ps1
      - name: Build
        # Compile the small project-owned shader; no compiler is shipped with the app.
        run: |
          ./scripts/Prepare-Shader.ps1
          dotnet build src/Lateraroot/Lateraroot.csproj -c Release
      - name: Storage and classification tests
        run: dotnet run --project tests/Lateraroot.Core.Tests -c Release
      - name: Publish portable app
        run: dotnet publish src/Lateraroot/Lateraroot.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Include documentation
        run: |
          Copy-Item LICENSE,README.md,CONTRIBUTING.md,THIRD_PARTY_NOTICES.md,Velopack-LICENSE.txt,Flaticon-LICENSE.txt artifacts/win-x64
          Copy-Item docs artifacts/win-x64/docs -Recurse
      - name: Package update-capable portable app
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path artifacts/tools
          if ($LASTEXITCODE -ne 0) { throw 'vpk installation failed' }
          $version = ([xml](Get-Content src/Lateraroot/Lateraroot.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          ./scripts/Package.ps1 -PublishDirectory artifacts/win-x64 -OutputDirectory artifacts/releases -Version $version -Vpk artifacts/tools/vpk.exe
      - name: Verify distributed UI with isolated demo files
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "lateraroot-ui-$env:GITHUB_RUN_ID"
          Expand-Archive "artifacts/releases/lateraroot-v$env:APP_VERSION-win-x64.zip" artifacts/verified
          $app = Start-Process artifacts/verified/Lateraroot.exe -ArgumentList "--demo --verify-ui --data-dir `"$testData`"" -Wait -PassThru -WindowStyle Hidden
          $result = Get-Content (Join-Path $testData 'verification/result.json') -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or !$result.Passed) { $result | ConvertTo-Json -Depth 5; throw 'UI verification failed' }
          Write-Output "$($result.Checks.Count) UI checks passed"
      - name: Verify update, restart, data preservation and corrupt download rejection
        shell: pwsh
        run: |
          $v = [version]$env:APP_VERSION
          $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          dotnet publish src/Lateraroot/Lateraroot.csproj -c Release -r win-x64 --self-contained true -p:Version=$next -o artifacts/test-next
          if ($LASTEXITCODE -ne 0) { throw 'Update fixture build failed' }
          ./artifacts/tools/vpk.exe pack --packId LaterarootApp --packTitle Lateraroot --packVersion $next --packDir artifacts/test-next --mainExe Lateraroot.exe --outputDir artifacts/test-feed --runtime win-x64 --noInst --delta None --yes --skip-updates
          if ($LASTEXITCODE -ne 0) { throw 'Update fixture packaging failed' }
          $archive = "artifacts/releases/lateraroot-v$env:APP_VERSION-win-x64.zip"
          ./scripts/Verify-Update.ps1 -Archive $archive -Feed artifacts/test-feed -TestRoot "$env:RUNNER_TEMP/update-roundtrip-$env:GITHUB_RUN_ID" -ExpectedVersion $next
          Copy-Item artifacts/test-feed artifacts/corrupt-feed -Recurse
          Get-ChildItem artifacts/corrupt-feed -Filter '*.nupkg' | ForEach-Object { [IO.File]::WriteAllBytes($_.FullName, [byte[]](0,1,2,3)) }
          ./scripts/Verify-Update.ps1 -Archive $archive -Feed artifacts/corrupt-feed -TestRoot "$env:RUNNER_TEMP/update-rejection-$env:GITHUB_RUN_ID" -RejectCorruptPackage
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/releases/*
      - name: Build and verify isolated glass preview
        shell: pwsh
        run: |
          dotnet publish src/Lateraroot/Lateraroot.csproj -c Release -r win-x64 --self-contained true -p:PreviewBuild=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/glass-preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview build failed' }
          $testData = Join-Path $env:RUNNER_TEMP "lateraroot-preview-$env:GITHUB_RUN_ID"
          $app = Start-Process artifacts/glass-preview/Lateraroot.exe -ArgumentList ('--demo --verify-preview --data-dir "' + $testData + '"') -Wait -PassThru -WindowStyle Hidden
          $result = Get-Content (Join-Path $testData 'preview-result.json') -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or !$result.Passed) { $result | ConvertTo-Json -Depth 5; throw 'Read-only preview verification failed' }
          Write-Output "$($result.Checks.Count) preview checks passed; GPU rendering is verified separately on a physical GPU."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --title "Lateraroot $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
